# Tiny Tapeout / Jane Street CMOS5L — CPU 1.1 UART
# 1.1 class line. 6x4. 2x16 bases. UART is FIRE on a pad.
project:
  title:        "CPU 1.1 UART"
  author:       "Joshua Luke Nuijens / Axiom 1 Technology, LLC"
  discord:      ""
  description:  "ONE CPU 1.1 32. UART, SPI, I2C. Second CPU 1.1 holds the face, count off. UART log, 128 sent and 128 received. Hook 11: Manchester, USB LS, JTAG, SWD, PS/2, CAN bit."
  language:     "Verilog"
  clock_hz:     50000000

  # Jane Street allocation. A tile is ~167x108 µm.
  tiles: "6x4"

  # Must start with tt_um_. Unique with github username.
  top_module:  "tt_um_jlnuijens_one11_uart"

  source_files:
    - "project.v"
    - "one_cpu11.v"
    - "js_uart_fire.v"
    - "js_range.v"
    - "js_spi_fire.v"
    - "js_i2c_fire.v"
    - "js_line_fire.v"
    - "js_tap_fire.v"
    - "js_bank.v"

pinout:
  ui[0]: "FIRE"
  ui[1]: "HOT"
  ui[2]: "LINE_IN"
  ui[3]: "MAP0"
  ui[4]: "MAP1"
  ui[5]: "RANGE0"
  ui[6]: "RANGE1"
  ui[7]: "RANGE2"

  uo[0]: "TX_DM"
  uo[1]: "BUSY"
  uo[2]: "ONES_OK"
  uo[3]: "GOT"
  uo[4]: "MOSI_SCL_TDI"
  uo[5]: "SCLK_TCK"
  uo[6]: "CS_TMS"
  uo[7]: "DP_FACE"

  uio[0]: "SEQ0_SDA_SWD"
  uio[1]: "SEQ1_PS2CK"
  uio[2]: "SEQ2"
  uio[3]: "SEQ3"
  uio[4]: "SEQ4"
  uio[5]: "SEQ5"
  uio[6]: "SEQ6"
  uio[7]: "SEQ7"

yaml_version: 6
