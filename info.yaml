# Tiny Tapeout / Jane Street CMOS5L — CPU 1.1 UART
# 1.1 class line. 6x4. 16 bases. UART is FIRE on a pad.
project:
  title:        "CPU 1.1 UART"
  author:       "Joshua Luke Nuijens / Axiom 1 Technology, LLC"
  discord:      ""
  description:  "CPU 1.1 UART. RX+TX. FIRE walks 8N1. 16 bases, 16 sites. 50 MHz, 1 clock/bit."
  language:     "Verilog"
  clock_hz:     50000000

  # Jane Street allocation. A tile is ~167x108 µm.
  tiles: "6x4"

  # Must start with tt_um_. Unique with github username.
  top_module:  "tt_um_jlnuijens_one11_uart"

  source_files:
    - "project.v"
    - "one_cpu11.v"
    - "js_uart_fire.v"

pinout:
  ui[0]: "FIRE"
  ui[1]: "HOT"
  ui[2]: "UART_RX"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  uo[0]: "UART_TX"
  uo[1]: "TX_BUSY"
  uo[2]: "ONES_OK"
  uo[3]: "RX_GOT"
  uo[4]: "FACE0"
  uo[5]: "FACE1"
  uo[6]: "FACE2"
  uo[7]: "FACE3"

  uio[0]: "SEQ0"
  uio[1]: "SEQ1"
  uio[2]: "SEQ2"
  uio[3]: "SEQ3"
  uio[4]: "SEQ4"
  uio[5]: "SEQ5"
  uio[6]: "SEQ6"
  uio[7]: "SEQ7"

yaml_version: 6
